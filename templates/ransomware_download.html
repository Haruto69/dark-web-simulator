<!DOCTYPE html>
<html>
<head>
    <title>Downloading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .download-container {
            text-align: center;
            width: 90%;
            max-width: 600px;
        }
        
        .download-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: spin 2s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 2em;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #0f0;
        }
        
        .progress-bar {
            width: 100%;
            height: 40px;
            border: 3px solid #0f0;
            margin: 20px auto;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f0, #0a0);
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 10px #0f0;
        }
        
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000;
            font-weight: bold;
            font-size: 1.2em;
            z-index: 10;
            text-shadow: 0 0 5px #fff;
        }
        
        .status-text {
            font-size: 1.3em;
            margin: 20px 0;
            min-height: 30px;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
        }
        
        .file-list {
            text-align: left;
            margin: 20px auto;
            max-width: 500px;
            font-size: 0.9em;
        }
        
        .file-item {
            padding: 5px;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .warning {
            color: #ff0;
            margin-top: 20px;
            font-size: 1.1em;
            display: none;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="download-container">
        <div class="download-icon">⬇️</div>
        <h1>DOWNLOADING HACKING TOOL...</h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
        <div class="status-text" id="status">Initializing download...</div>
        <div class="file-list" id="fileList"></div>
        <div class="warning" id="warning">⚠️ SYSTEM ACCESS DETECTED ⚠️</div>
    </div>

    <script>
        const statuses = [
            "Connecting to dark web server...",
            "Downloading tool package [MetaSploit_Pro.exe]...",
            "Extracting files...",
            "Installing components...",
            "Configuring system access...",
            "Disabling antivirus...",
            "Establishing backdoor connection...",
            "Finalizing installation..."
        ];
        
        const files = [
            "→ exploit_framework.dll",
            "→ network_scanner.exe",
            "→ credential_harvester.sys",
            "→ keylogger.dll",
            "→ ransomware_payload.exe",
            "→ bitcoin_wallet_stealer.py",
            "→ webcam_access.dll"
        ];
        
        let progress = 0;
        let statusIndex = 0;
        let fileIndex = 0;
        
        const progressBar = document.getElementById('progress');
        const progressText = document.getElementById('progressText');
        const statusElement = document.getElementById('status');
        const fileList = document.getElementById('fileList');
        const warning = document.getElementById('warning');
        
        const interval = setInterval(() => {
            progress += Math.random() * 15 + 5;
            if (progress > 100) progress = 100;
            
            progressBar.style.width = progress + '%';
            progressText.textContent = Math.floor(progress) + '%';
            
            // Update status
            if (statusIndex < statuses.length && progress > (statusIndex + 1) * 12) {
                statusElement.textContent = statuses[statusIndex];
                statusIndex++;
            }
            
            // Show files being extracted
            if (fileIndex < files.length && progress > (fileIndex + 1) * 14) {
                const fileDiv = document.createElement('div');
                fileDiv.className = 'file-item';
                fileDiv.textContent = files[fileIndex];
                fileDiv.style.animationDelay = (fileIndex * 0.1) + 's';
                fileList.appendChild(fileDiv);
                fileIndex++;
            }
            
            // Show warning at 80%
            if (progress > 80 && warning.style.display === 'none') {
                warning.style.display = 'block';
            }
            
            // Redirect when complete
            if (progress >= 100) {
                clearInterval(interval);
                statusElement.textContent = "Installation complete! Launching...";
                progressText.textContent = "100%";
                setTimeout(() => {
                    // State-changing: submit the CSRF-protected POST form.
                    document.getElementById('ransomwareActivateForm').submit();
                }, 1000);
            }
        }, 250);
    </script>
<!-- State-changing, so it is a POST carrying this session's CSRF token.
     A GET can no longer trigger the simulation. -->
<form id="ransomwareActivateForm" method="post" action="{{ url_for('ransomware_activate') }}"
      style="display:none">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
</form>
</body>
</html>
